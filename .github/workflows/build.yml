name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            binary: iptvshows
            artifact: iptvshows-linux
          - os: windows-latest
            name: windows
            binary: iptvshows.exe
            artifact: iptvshows-windows
          - os: macos-latest
            name: macos
            binary: iptvshows
            artifact: iptvshows-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Install Linux display deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libx11-xcb1

      - name: Build (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller \
            --onefile \
            --name iptvshows \
            --noconfirm \
            --clean \
            --icon iptvshow.ico \
            --hidden-import PyQt6 \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.QtMultimedia \
            --hidden-import PyQt6.sip \
            --hidden-import PyQt6.QtDBus \
            --hidden-import requests \
            --hidden-import requests.adapters \
            --hidden-import requests.auth \
            --hidden-import requests.cookies \
            --hidden-import requests.exceptions \
            --hidden-import urllib3 \
            --hidden-import urllib3.util.retry \
            --hidden-import urllib3.util.timeout \
            --hidden-import sqlite3 \
            --hidden-import json \
            --hidden-import threading \
            --hidden-import datetime \
            --hidden-import hashlib \
            --hidden-import base64 \
            --hidden-import re \
            main.py

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller `
            --onefile `
            --name iptvshows `
            --noconfirm `
            --clean `
            --icon iptvshow.ico `
            --hidden-import PyQt6 `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtNetwork `
            --hidden-import PyQt6.QtMultimedia `
            --hidden-import PyQt6.sip `
            --hidden-import PyQt6.QtDBus `
            --hidden-import requests `
            --hidden-import requests.adapters `
            --hidden-import requests.auth `
            --hidden-import requests.cookies `
            --hidden-import requests.exceptions `
            --hidden-import urllib3 `
            --hidden-import urllib3.util.retry `
            --hidden-import urllib3.util.timeout `
            --hidden-import sqlite3 `
            --hidden-import json `
            --hidden-import threading `
            --hidden-import datetime `
            --hidden-import hashlib `
            --hidden-import base64 `
            --hidden-import re `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/iptvshows-linux/iptvshows       iptvshows-linux
          mv artifacts/iptvshows-windows/iptvshows.exe iptvshows-windows.exe
          mv artifacts/iptvshows-macos/iptvshows       iptvshows-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iptvshows-linux
            iptvshows-windows.exe
            iptvshows-macos
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
